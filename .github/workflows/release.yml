name: release

# A tag `v*` builds one self-contained binary per platform and attaches them
# to the GitHub release of that tag: `customs-<target>.tar.gz`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: check it's self-contained
        run: |
          bin=target/${{ matrix.target }}/release/customs
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          else
            if otool -L "$bin" | tail -n +2 | grep -v '/usr/lib/libSystem'; then exit 1; fi
          fi
      - name: package
        run: |
          tar -C target/${{ matrix.target }}/release -czf customs-${{ matrix.target }}.tar.gz customs
      - uses: actions/upload-artifact@v4
        with:
          name: customs-${{ matrix.target }}
          path: customs-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes customs-*.tar.gz
