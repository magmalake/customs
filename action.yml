name: customs
description: "Checks a Mojo project's imports: no module cycles, and each name imported from the file that defines it."
branding:
  icon: check-circle
  color: green

inputs:
  args:
    description: "customs' arguments: `-I DIR`s and the project, as on the command line."
    default: "."
  version:
    description: >-
      The release to run, as `v0.2.0`, or `latest`. By default the action's
      own ref when that's a version tag (`ouromo/customs@v0.2.0`), else the
      latest release.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        v="$VERSION"
        if [ -z "$v" ]; then
          case "$ACTION_REF" in v[0-9]*) v="$ACTION_REF" ;; *) v=latest ;; esac
        fi
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) t=x86_64-unknown-linux-musl ;;
          Linux-aarch64 | Linux-arm64) t=aarch64-unknown-linux-musl ;;
          Darwin-arm64) t=aarch64-apple-darwin ;;
          Darwin-x86_64) t=x86_64-apple-darwin ;;
          *) echo "customs: no build for $(uname -s) $(uname -m)" >&2; exit 2 ;;
        esac
        if [ "$v" = latest ]; then
          url="https://github.com/ouromo/customs/releases/latest/download/customs-$t.tar.gz"
        else
          url="https://github.com/ouromo/customs/releases/download/$v/customs-$t.tar.gz"
        fi
        dir="$RUNNER_TEMP/customs-bin"
        mkdir -p "$dir"
        curl -fsSL --retry 3 "$url" | tar -xz -C "$dir"
        "$dir/customs" --version
        # $ARGS is split into words on purpose: it's a command line.
        "$dir/customs" $ARGS
